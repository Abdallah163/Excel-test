<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Excel Skills Test</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0 20px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #198754;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #157347;
}

.option {
    display: block;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
}

.option:hover {
    background: #f0f0f0;
}

#test {
    display: none;
}

#result {
    display: none;
    text-align: center;
}

.timer {
    text-align: right;
    font-weight: bold;
    color: red;
}

</style>

</head>

<body>

<div class="container">

    <h1>Microsoft Excel Test</h1>

    <div id="start">

        <p>15 Questions</p>

        <p>30 Seconds per Question</p>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <button onclick="startTest()">
            Start Test
        </button>

    </div>


    <div id="test">

        <div class="timer">
            Time: <span id="timer">30</span>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

    </div>


    <div id="result">

        <h2>Test Completed</h2>

        <h3 id="score"></h3>

        <p id="percentage"></p>

        <p id="level"></p>

    </div>

</div>


<script>

const questions = [

    {
        question: "Which function is used to calculate the average?",
        options: [
            "SUM",
            "AVERAGE",
            "COUNT",
            "MAX"
        ],
        answer: 1
    },

    {
        question: "Which symbol is used to start a formula in Excel?",
        options: [
            "+",
            "#",
            "=",
            "$"
        ],
        answer: 2
    },

    {
        question: "Which function counts numbers?",
        options: [
            "COUNT",
            "SUM",
            "TEXT",
            "IF"
        ],
        answer: 0
    },

    {
        question: "Which function returns the largest value?",
        options: [
            "MIN",
            "MAX",
            "LARGE",
            "HIGH"
        ],
        answer: 1
    },

    {
        question: "Which function is commonly used for logical conditions?",
        options: [
            "IF",
            "SUM",
            "ROUND",
            "LEFT"
        ],
        answer: 0
    },

    {
        question: "Which shortcut saves an Excel workbook?",
        options: [
            "Ctrl + S",
            "Ctrl + P",
            "Ctrl + C",
            "Ctrl + X"
        ],
        answer: 0
    },

    {
        question: "Which function searches for a value vertically?",
        options: [
            "HLOOKUP",
            "VLOOKUP",
            "SUMIF",
            "COUNTIF"
        ],
        answer: 1
    },

    {
        question: "Which function counts cells based on a condition?",
        options: [
            "COUNT",
            "COUNTIF",
            "COUNTA",
            "SUM"
        ],
        answer: 1
    },

    {
        question: "What does Ctrl + C do?",
        options: [
            "Copy",
            "Cut",
            "Paste",
            "Close"
        ],
        answer: 0
    },

    {
        question: "What does Ctrl + V do?",
        options: [
            "Copy",
            "Paste",
            "Cut",
            "Save"
        ],
        answer: 1
    },

    {
        question: "Which function adds numbers?",
        options: [
            "SUM",
            "ADD",
            "TOTAL",
            "PLUS"
        ],
        answer: 0
    },

    {
        question: "Which feature creates visual charts?",
        options: [
            "Charts",
            "Filter",
            "Sort",
            "Freeze Panes"
        ],
        answer: 0
    },

    {
        question: "Which feature removes duplicate records?",
        options: [
            "Remove Duplicates",
            "Filter",
            "Sort",
            "Format Painter"
        ],
        answer: 0
    },

    {
        question: "Which function returns today's date?",
        options: [
            "DATE()",
            "NOW()",
            "TODAY()",
            "DAY()"
        ],
        answer: 2
    },

    {
        question: "Which tool is useful for summarizing large datasets?",
        options: [
            "PivotTable",
            "WordArt",
            "Format Painter",
            "Page Layout"
        ],
        answer: 0
    }

];


let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 30;
let userName = "";


function startTest() {

    userName = document
        .getElementById("name")
        .value
        .trim();

    if (!userName) {

        alert("Please enter your name.");

        return;
    }

    document.getElementById("start").style.display = "none";

    document.getElementById("test").style.display = "block";

    showQuestion();
}


function showQuestion() {

    clearInterval(timer);

    timeLeft = 30;

    document.getElementById("timer").innerText = timeLeft;

    const q = questions[currentQuestion];

    document.getElementById("question").innerText =
        `${currentQuestion + 1}. ${q.question}`;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.innerText = option;

        button.style.background = "white";

        button.style.color = "#333";

        button.style.border = "1px solid #ddd";

        button.onclick = () => selectAnswer(index);

        options.appendChild(button);

    });

    timer = setInterval(() => {

        timeLeft--;

        document.getElementById("timer").innerText =
            timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            nextQuestion();

        }

    }, 1000);

}


function selectAnswer(index) {

    clearInterval(timer);

    if (index === questions[currentQuestion].answer) {

        score++;

    }

    nextQuestion();

}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        finishTest();

    } else {

        showQuestion();

    }

}


function finishTest() {

    clearInterval(timer);

    document.getElementById("test").style.display = "none";

    document.getElementById("result").style.display = "block";

    const percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("score").innerText =
        `Score: ${score} / ${questions.length}`;

    document.getElementById("percentage").innerText =
        `Percentage: ${percentage}%`;

    let level;

    if (percentage >= 90) {

        level = "Excellent";

    } else if (percentage >= 75) {

        level = "Very Good";

    } else if (percentage >= 60) {

        level = "Good";

    } else if (percentage >= 50) {

        level = "Pass";

    } else {

        level = "Needs Improvement";

    }

    document.getElementById("level").innerText =
        `Level: ${level}`;


    // Save result to Google Sheet

    google.script.run
        .withSuccessHandler(function(response) {

            console.log("Result saved:", response);

        })
        .withFailureHandler(function(error) {

            console.error("Error:", error);

        })
        .saveResult({

            name: userName,

            score: score,

            total: questions.length

        });

}

</script>

</body>

</html>
