<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار Excel - 15 سؤال</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f6f9;color:#17202a}
.container{max-width:850px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}
h1{margin-top:0}.muted{color:#65727e}.hidden{display:none}
input{width:100%;padding:14px;border:1px solid #ccd5dd;border-radius:10px;font-size:16px;margin:10px 0 18px}
button{border:0;border-radius:10px;padding:13px 20px;font-size:16px;cursor:pointer;background:#1677ff;color:#fff}
button.secondary{background:#e8eef5;color:#17202a;margin-right:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.timer{font-size:24px;font-weight:700;background:#fff0f0;color:#c62828;padding:8px 14px;border-radius:12px;min-width:90px;text-align:center}
.progress{height:8px;background:#e8edf2;border-radius:10px;overflow:hidden;margin-bottom:20px}.bar{height:100%;background:#1677ff;width:0}
.option{display:block;border:1px solid #d8e0e7;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}
.option:hover{background:#f5f9ff}.option input{width:auto;margin:0 8px 0 0}
.actions{margin-top:22px}.result{text-align:center}.score{font-size:52px;font-weight:800;color:#1677ff}
.small{font-size:13px;color:#6b7785}.review{margin-top:22px;text-align:right}.review div{padding:10px;border-radius:8px;margin:8px 0;background:#f5f7f9}
.correct{border-right:5px solid #2e9d55}.wrong{border-right:5px solid #d64545}
</style>
</head>
<body>
<div class="container">
<div class="card" id="start">
<h1>اختبار مهارات Microsoft Excel</h1>
<p class="muted">15 سؤالًا — 30 ثانية لكل سؤال — المدة الإجمالية القصوى 7:30 دقائق.</p>
<label>اسم المتقدم</label>
<input id="name" placeholder="اكتب اسمك هنا" maxlength="80">
<button onclick="startQuiz()">ابدأ الاختبار</button>
<p class="small">سيتم الانتقال تلقائيًا للسؤال التالي عند انتهاء الوقت.</p>
</div>

<div class="card hidden" id="quiz">
<div class="top"><div><b id="qnum"></b><div class="muted" id="difficulty"></div></div><div class="timer" id="timer">30</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2>
<div id="options"></div>
<div class="actions"><button onclick="nextQuestion()">التالي</button></div>
</div>

<div class="card hidden result" id="result">
<h1>انتهى الاختبار 🎉</h1>
<p id="resultName"></p>
<div class="score" id="score"></div>
<p id="summary"></p>
<button onclick="downloadResults()">تحميل النتائج CSV</button>
<div class="review" id="review"></div>
</div>
</div>

<script>
const questions = [
{d:"سهل",q:"أي دالة تُستخدم لجمع مجموعة من الأرقام؟",o:["AVERAGE","SUM","COUNT","MAX"],a:1},
{d:"سهل",q:"ما الاختصار الشائع لحفظ ملف Excel؟",o:["Ctrl + P","Ctrl + S","Ctrl + F","Ctrl + Z"],a:1},
{d:"سهل",q:"أي دالة تحسب متوسط مجموعة من القيم؟",o:["SUM","AVERAGE","MIN","IF"],a:1},
{d:"سهل",q:"ماذا يحدث عند الضغط على Ctrl + Z؟",o:["إعادة آخر إجراء","حذف الصف","التراجع عن آخر إجراء","حفظ الملف"],a:2},
{d:"متوسط",q:"أي دالة تحسب عدد الخلايا التي تحتوي على أرقام؟",o:["COUNT","COUNTA","COUNTIF","SUM"],a:0},
{d:"متوسط",q:"إذا كانت الخلية A1 تحتوي على 80، فما نتيجة الصيغة =IF(A1>=50,\"ناجح\",\"راسب\")؟",o:["50","80","ناجح","راسب"],a:2},
{d:"متوسط",q:"ما الأداة الأنسب لإظهار الصفوف التي تحقق شرطًا معينًا وإخفاء الباقي مؤقتًا؟",o:["Filter","Merge","Wrap Text","Format Painter"],a:0},
{d:"متوسط",q:"أي مرجع يبقى ثابتًا عند نسخ الصيغة إلى خلية أخرى؟",o:["A1","A$1","$A$1","A1$"],a:2},
{d:"متوسط",q:"ما الوظيفة الأساسية لـ VLOOKUP؟",o:["إنشاء رسم بياني","البحث عن قيمة في عمود وإرجاع قيمة مرتبطة","دمج الخلايا","حساب المتوسط"],a:1},
{d:"متقدم",q:"في Excel الحديث، أي دالة مرنة تُستخدم للبحث وإرجاع قيمة مرتبطة ويمكنها البحث في أي اتجاه؟",o:["XLOOKUP","SUM","ROUND","LEFT"],a:0},
{d:"متقدم",q:"ما أفضل أداة لتلخيص بيانات مبيعات كبيرة حسب الشهر والمنتج والمندوب بسرعة؟",o:["WordArt","PivotTable","Page Layout","Find & Replace"],a:1},
{d:"متقدم",q:"ما نتيجة =SUMIFS(C:C,A:A,\"القاهرة\",B:B,\">=100\")؟",o:["متوسط المبيعات","جمع قيم العمود C عندما A=القاهرة وB>=100","عدد الصفوف","أكبر قيمة"],a:1},
{d:"متقدم",q:"ما فائدة Conditional Formatting؟",o:["حماية المصنف فقط","تغيير شكل الخلايا تلقائيًا حسب شروط","إنشاء ورقة جديدة","ضغط حجم الملف"],a:1},
{d:"متقدم",q:"أي أداة تمنع إدخال قيم غير مسموح بها داخل خلية، مثل السماح باختيار قسم من قائمة؟",o:["Data Validation","Goal Seek","Freeze Panes","Text to Columns"],a:0},
{d:"متقدم",q:"لديك جدول مبيعات وتريد استخراج العملاء الذين تجاوز إجمالي مشترياتهم 10,000 ثم ترتيبهم تنازليًا. ما الحل الأنسب في Excel الحديث؟",o:["نسخ البيانات يدويًا","استخدام FILTER ثم SORT","استخدام Merge Cells","تغيير عرض الأعمدة فقط"],a:1}
];

let idx=0, score=0, timer=30, interval=null, name="", answers=[], resultsKey="excelQuizResults";

function startQuiz(){
 name=document.getElementById("name").value.trim();
 if(!name){alert("من فضلك اكتب اسم المتقدم.");return}
 document.getElementById("start").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 idx=0;score=0;answers=[];showQuestion();
}
function showQuestion(){
 const q=questions[idx];
 document.getElementById("qnum").textContent=`السؤال ${idx+1} من ${questions.length}`;
 document.getElementById("difficulty").textContent=`المستوى: ${q.d}`;
 document.getElementById("question").textContent=q.q;
 document.getElementById("bar").style.width=((idx)/questions.length*100)+"%";
 const box=document.getElementById("options"); box.innerHTML="";
 q.o.forEach((x,i)=>{
   const label=document.createElement("label");label.className="option";
   label.innerHTML=`<input type="radio" name="answer" value="${i}"> ${String.fromCharCode(65+i)}. ${x}`;
   box.appendChild(label);
 });
 timer=30;document.getElementById("timer").textContent=timer;
 clearInterval(interval);interval=setInterval(()=>{timer--;document.getElementById("timer").textContent=timer;if(timer<=0){clearInterval(interval);nextQuestion(true)}},1000);
}
function nextQuestion(auto=false){
 clearInterval(interval);
 const selected=document.querySelector('input[name="answer"]:checked');
 const chosen=selected?Number(selected.value):null;
 answers[idx]=chosen;
 if(chosen===questions[idx].a)score++;
 idx++;
 if(idx<questions.length) showQuestion(); else finish();
}
function finish(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=`${score} / ${questions.length}`;
 document.getElementById("resultName").textContent=`المتقدم: ${name}`;
 document.getElementById("summary").textContent=`النسبة: ${Math.round(score/questions.length*100)}%`;
 const review=document.getElementById("review");review.innerHTML="<h3>مراجعة الإجابات</h3>";
 questions.forEach((q,i)=>{
   const ok=answers[i]===q.a;
   const div=document.createElement("div");div.className=ok?"correct":"wrong";
   div.innerHTML=`<b>${i+1}. ${ok?"صحيحة":"غير صحيحة/بدون إجابة"}</b><br>الإجابة الصحيحة: ${q.o[q.a]}`;
   review.appendChild(div);
 });
 saveResult();
}
function saveResult(){
 const data=JSON.parse(localStorage.getItem(resultsKey)||"[]");
 data.push({name,score,total:questions.length,percent:Math.round(score/questions.length*100),date:new Date().toLocaleString("ar-EG"),answers});
 localStorage.setItem(resultsKey,JSON.stringify(data));
}
function downloadResults(){
 const data=JSON.parse(localStorage.getItem(resultsKey)||"[]");
 let csv="Name,Score,Total,Percent,Date\n";
 data.forEach(r=>csv+=`"${r.name.replaceAll('"','""')}",${r.score},${r.total},${r.percent}%,"${r.date}"\n`);
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="excel_quiz_results.csv";a.click();
}
</script>
</body>
</html>
