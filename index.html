<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Excel Skills Test</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0 20px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #198754;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #157347;
}

.option {
    display: block;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
}

.option:hover {
    background: #f0f0f0;
}

#test {
    display: none;
}

#result {
    display: none;
    text-align: center;
}

.timer {
    text-align: right;
    font-weight: bold;
    color: red;
}

</style>

</head>

<body>

<div class="container">

    <h1>Microsoft Excel Test</h1>

    <div id="start">

        <p>15 Questions</p>

        <p>30 Seconds per Question</p>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <button onclick="startTest()">
            Start Test
        </button>

    </div>


    <div id="test">

        <div class="timer">
            Time: <span id="timer">30</span>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

    </div>


    <div id="result">

        <h2>Test Completed</h2>

        <h3 id="score"></h3>

        <p id="percentage"></p>

        <p id="level"></p>

    </div>

</div>


<script>
/****************************************************
 * Excel Skills Test
 * Arabic
 * 15 Questions
 * 30 Seconds Per Question
 * Google Sheets Integration
 ****************************************************/


/****************************************************
 * Google Apps Script Web App URL
 ****************************************************/

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyeVHqvW1EfRKCA7-nk1-OoWFBng9oDMDyvaabnMAr6TjpgnE4ggM9nahOhH-lWuUwy/exec";


/****************************************************
 * Questions
 ****************************************************/

const questions = [

    {
        question:
            "أي دالة تستخدم لحساب مجموع مجموعة من الأرقام؟",

        options: [
            "AVERAGE",
            "SUM",
            "COUNT",
            "MAX"
        ],

        answer: 1
    },


    {
        question:
            "ما الرمز الذي تبدأ به المعادلات في Excel؟",

        options: [
            "+",
            "#",
            "=",
            "$"
        ],

        answer: 2
    },


    {
        question:
            "أي دالة تستخدم لحساب المتوسط الحسابي؟",

        options: [
            "SUM",
            "AVERAGE",
            "COUNT",
            "MIN"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تُستخدم لإيجاد أكبر قيمة؟",

        options: [
            "MIN",
            "MAX",
            "LARGE",
            "HIGH"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تُستخدم لتنفيذ شرط منطقي؟",

        options: [
            "SUM",
            "IF",
            "COUNT",
            "ROUND"
        ],

        answer: 1
    },


    {
        question:
            "ما اختصار حفظ ملف Excel؟",

        options: [
            "Ctrl + C",
            "Ctrl + V",
            "Ctrl + S",
            "Ctrl + X"
        ],

        answer: 2
    },


    {
        question:
            "أي دالة تستخدم للبحث الرأسي في جدول؟",

        options: [
            "HLOOKUP",
            "VLOOKUP",
            "SUMIF",
            "COUNTIF"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تحسب عدد الخلايا التي تحقق شرطًا معينًا؟",

        options: [
            "COUNT",
            "COUNTIF",
            "COUNTA",
            "SUM"
        ],

        answer: 1
    },


    {
        question:
            "ما وظيفة الاختصار Ctrl + C؟",

        options: [
            "نسخ",
            "لصق",
            "قص",
            "حفظ"
        ],

        answer: 0
    },


    {
        question:
            "ما وظيفة الاختصار Ctrl + V؟",

        options: [
            "نسخ",
            "لصق",
            "قص",
            "حذف"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تُستخدم لإرجاع تاريخ اليوم؟",

        options: [
            "DATE()",
            "NOW()",
            "TODAY()",
            "DAY()"
        ],

        answer: 2
    },


    {
        question:
            "ما الأداة المناسبة لتلخيص وتحليل كمية كبيرة من البيانات؟",

        options: [
            "PivotTable",
            "WordArt",
            "Format Painter",
            "Page Layout"
        ],

        answer: 0
    },


    {
        question:
            "ما الأداة التي تستخدم لإزالة البيانات المكررة؟",

        options: [
            "Sort",
            "Filter",
            "Remove Duplicates",
            "Freeze Panes"
        ],

        answer: 2
    },


    {
        question:
            "ما وظيفة Filter في Excel؟",

        options: [
            "حذف البيانات",
            "عرض البيانات التي تحقق شروطًا معينة",
            "تغيير لون الخلايا",
            "دمج الخلايا"
        ],

        answer: 1
    },


    {
        question:
            "أي أداة تستخدم لإنشاء رسوم بيانية للبيانات؟",

        options: [
            "Charts",
            "Filter",
            "Sort",
            "Freeze Panes"
        ],

        answer: 0
    }

];


/****************************************************
 * Variables
 ****************************************************/

let currentQuestion = 0;

let score = 0;

let userName = "";

let startTime = null;

let timerInterval = null;

let timeLeft = 30;


/****************************************************
 * Start Test
 ****************************************************/

function startTest() {

    const nameInput =
        document.getElementById("name");


    if (!nameInput) {

        console.error(
            "Element #name not found"
        );

        return;

    }


    userName =
        nameInput.value.trim();


    if (!userName) {

        alert(
            "من فضلك اكتب اسمك أولاً"
        );

        nameInput.focus();

        return;

    }


    // Reset test
    currentQuestion = 0;

    score = 0;

    startTime = new Date();


    // Hide start screen
    const startScreen =
        document.getElementById("start");


    if (startScreen) {

        startScreen.style.display =
            "none";

    }


    // Show test
    const testScreen =
        document.getElementById("test");


    if (testScreen) {

        testScreen.style.display =
            "block";

    }


    // Start first question
    showQuestion();

}


/****************************************************
 * Show Question
 ****************************************************/

function showQuestion() {

    clearInterval(timerInterval);


    timeLeft = 30;

    updateTimer();


    const question =
        questions[currentQuestion];


    if (!question) {

        finishTest();

        return;

    }


    // Question text
    const questionElement =
        document.getElementById("question");


    if (questionElement) {

        questionElement.textContent =
            `${currentQuestion + 1} من ${questions.length} - ${question.question}`;

    }


    // Options container
    const optionsContainer =
        document.getElementById("options");


    if (!optionsContainer) {

        console.error(
            "Element #options not found"
        );

        return;

    }


    optionsContainer.innerHTML = "";


    // Create options
    question.options.forEach(
        function(option, index) {

            const button =
                document.createElement("button");


            button.type = "button";


            button.className =
                "option";


            button.textContent =
                option;


            button.addEventListener(
                "click",
                function() {

                    selectAnswer(index);

                }
            );


            optionsContainer.appendChild(
                button
            );

        }
    );


    // Start timer
    timerInterval =
        setInterval(
            function() {

                timeLeft--;

                updateTimer();


                if (timeLeft <= 0) {

                    clearInterval(
                        timerInterval
                    );


                    nextQuestion();

                }

            },
            1000
        );

}


/****************************************************
 * Update Timer
 ****************************************************/

function updateTimer() {

    const timerElement =
        document.getElementById("timer");


    if (timerElement) {

        timerElement.textContent =
            timeLeft;

    }

}


/****************************************************
 * Select Answer
 ****************************************************/

function selectAnswer(index) {

    clearInterval(timerInterval);


    const question =
        questions[currentQuestion];


    if (
        question &&
        index === question.answer
    ) {

        score++;

    }


    nextQuestion();

}


/****************************************************
 * Next Question
 ****************************************************/

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        finishTest();

        return;

    }


    showQuestion();

}


/****************************************************
 * Finish Test
 ****************************************************/

function finishTest() {

    clearInterval(timerInterval);


    // End time
    const endTime =
        new Date();


    // Calculate duration
    let durationSeconds = 0;


    if (startTime) {

        durationSeconds =
            Math.floor(
                (endTime - startTime) /
                1000
            );

    }


    const minutes =
        Math.floor(
            durationSeconds / 60
        );


    const seconds =
        durationSeconds % 60;


    const duration =
        `${minutes} دقيقة و ${seconds} ثانية`;


    // Score
    const total =
        questions.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    // Level
    let level = "";


    if (percentage >= 90) {

        level = "ممتاز";

    }
    else if (percentage >= 75) {

        level = "جيد جدًا";

    }
    else if (percentage >= 60) {

        level = "جيد";

    }
    else if (percentage >= 50) {

        level = "مقبول";

    }
    else {

        level = "يحتاج إلى تحسين";

    }


    // Hide test
    const testScreen =
        document.getElementById("test");


    if (testScreen) {

        testScreen.style.display =
            "none";

    }


    // Show result
    const resultScreen =
        document.getElementById("result");


    if (resultScreen) {

        resultScreen.style.display =
            "block";

    }


    // Score
    const scoreElement =
        document.getElementById("score");


    if (scoreElement) {

        scoreElement.textContent =
            `درجتك: ${score} من ${total}`;

    }


    // Percentage
    const percentageElement =
        document.getElementById(
            "percentage"
        );


    if (percentageElement) {

        percentageElement.textContent =
            `النسبة: ${percentage}%`;

    }


    // Level
    const levelElement =
        document.getElementById("level");


    if (levelElement) {

        levelElement.textContent =
            `التقييم: ${level}`;

    }


    // Save result
    saveResultToGoogleSheet({

        name: userName,

        score: score,

        total: total,

        percentage: percentage,

        duration: duration

    });

}


/****************************************************
 * Send Result To Google Sheets
 ****************************************************/

function saveResultToGoogleSheet(data) {

    console.log(
        "Sending result...",
        data
    );


    /*
     * Hidden iframe
     *
     * We use a form POST instead of fetch()
     * to avoid CORS problems.
     */


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.name =
        "googleSheetFrame";


    iframe.style.display =
        "none";


    document.body.appendChild(
        iframe
    );


    // Create form
    const form =
        document.createElement(
            "form"
        );


    form.method =
        "POST";


    form.action =
        GOOGLE_SCRIPT_URL;


    form.target =
        "googleSheetFrame";


    form.style.display =
        "none";


    // Add fields
    addFormField(
        form,
        "name",
        data.name
    );


    addFormField(
        form,
        "score",
        data.score
    );


    addFormField(
        form,
        "total",
        data.total
    );


    addFormField(
        form,
        "percentage",
        data.percentage
    );


    addFormField(
        form,
        "duration",
        data.duration
    );


    // Add form to page
    document.body.appendChild(
        form
    );


    // Submit
    form.submit();


    console.log(
        "Result submitted to Google Sheets"
    );


    // Remove temporary elements
    setTimeout(
        function() {

            if (form) {

                form.remove();

            }


            if (iframe) {

                iframe.remove();

            }

        },
        5000
    );

}


/****************************************************
 * Add Hidden Form Field
 ****************************************************/

function addFormField(
    form,
    name,
    value
) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "hidden";


    input.name =
        name;


    input.value =
        value;


    form.appendChild(
        input
    );

}
</script>

</body>

</html>
