<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>اختبار مهارات Excel</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 30px;

            direction: rtl;

        }


        .container {

            max-width: 700px;

            margin: 30px auto;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.1);

        }


        h1 {

            text-align: center;

            color: #198754;

            margin-bottom: 25px;

        }


        .info {

            text-align: center;

            color: #555;

            margin-bottom: 25px;

        }


        input {

            width: 100%;

            padding: 14px;

            margin: 10px 0 20px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

            direction: rtl;

        }


        input:focus {

            outline: none;

            border-color: #198754;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #198754;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 8px;

        }


        button:hover {

            background: #157347;

        }


        #test {

            display: none;

        }


        #result {

            display: none;

            text-align: center;

        }


        .timer {

            text-align: center;

            font-weight: bold;

            color: #dc3545;

            background: #fff3f3;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

        }


        .question-number {

            color: #198754;

            font-weight: bold;

            margin-bottom: 10px;

        }


        #question {

            line-height: 1.7;

            margin-bottom: 20px;

        }


        #options {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .option {

            background: white;

            color: #333;

            border: 1px solid #ddd;

            text-align: right;

            margin: 0;

        }


        .option:hover {

            background: #f0f8f4;

            border-color: #198754;

        }


        .score-box {

            background: #f4f6f8;

            border-radius: 10px;

            padding: 20px;

            margin-top: 20px;

        }


        .score-box h2 {

            color: #198754;

        }


        .saving {

            margin-top: 20px;

            color: #666;

            font-size: 14px;

        }


        .success {

            color: #198754;

            font-weight: bold;

        }


    </style>

</head>


<body>


<div class="container">


    <!-- Start Screen -->

    <div id="start">

        <h1>
            اختبار مهارات Microsoft Excel
        </h1>


        <div class="info">

            <p>
                اختبار مكون من 15 سؤالًا
            </p>

            <p>
                لديك 30 ثانية لكل سؤال
            </p>

        </div>


        <input
            type="text"
            id="name"
            placeholder="اكتب اسمك بالكامل"
            autocomplete="name"
        >


        <button
            type="button"
            onclick="startTest()"
        >

            ابدأ الاختبار

        </button>

    </div>


    <!-- Test Screen -->

    <div id="test">


        <div class="timer">

            الوقت المتبقي:

            <span id="timer">
                30
            </span>

            ثانية

        </div>


        <div
            class="question-number"
            id="questionNumber"
        >

        </div>


        <h2 id="question"></h2>


        <div id="options"></div>


    </div>


    <!-- Result Screen -->

    <div id="result">


        <h1>
            انتهى الاختبار
        </h1>


        <div class="score-box">

            <h2 id="score"></h2>

            <p id="percentage"></p>

            <p id="level"></p>

        </div>


        <p
            id="saving"
            class="saving"
        >
            جاري حفظ النتيجة...
        </p>


    </div>


</div>


<script>


/****************************************************
 * Google Apps Script Web App
 ****************************************************/

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyXAoT2TM742x_lsBx4M-sQaVHReE6kMzCyLsuCZbUyJedW3rg4UcqMOpT-_Idle6eI/exec";


/****************************************************
 * Questions
 ****************************************************/

const questions = [

    {
        question:
            "أي دالة تستخدم لحساب مجموع مجموعة من الأرقام؟",

        options: [
            "AVERAGE",
            "SUM",
            "COUNT",
            "MAX"
        ],

        answer: 1
    },


    {
        question:
            "ما الرمز الذي تبدأ به المعادلات في Excel؟",

        options: [
            "+",
            "#",
            "=",
            "$"
        ],

        answer: 2
    },


    {
        question:
            "أي دالة تستخدم لحساب المتوسط الحسابي؟",

        options: [
            "SUM",
            "AVERAGE",
            "COUNT",
            "MIN"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تُستخدم لإيجاد أكبر قيمة؟",

        options: [
            "MIN",
            "MAX",
            "LARGE",
            "HIGH"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تُستخدم لتنفيذ شرط منطقي؟",

        options: [
            "SUM",
            "IF",
            "COUNT",
            "ROUND"
        ],

        answer: 1
    },


    {
        question:
            "ما اختصار حفظ ملف Excel؟",

        options: [
            "Ctrl + C",
            "Ctrl + V",
            "Ctrl + S",
            "Ctrl + X"
        ],

        answer: 2
    },


    {
        question:
            "أي دالة تستخدم للبحث الرأسي في جدول؟",

        options: [
            "HLOOKUP",
            "VLOOKUP",
            "SUMIF",
            "COUNTIF"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تحسب عدد الخلايا التي تحقق شرطًا معينًا؟",

        options: [
            "COUNT",
            "COUNTIF",
            "COUNTA",
            "SUM"
        ],

        answer: 1
    },


    {
        question:
            "ما وظيفة الاختصار Ctrl + C؟",

        options: [
            "نسخ",
            "لصق",
            "قص",
            "حفظ"
        ],

        answer: 0
    },


    {
        question:
            "ما وظيفة الاختصار Ctrl + V؟",

        options: [
            "نسخ",
            "لصق",
            "قص",
            "حذف"
        ],

        answer: 1
    },


    {
        question:
            "أي دالة تُستخدم لإرجاع تاريخ اليوم؟",

        options: [
            "DATE()",
            "NOW()",
            "TODAY()",
            "DAY()"
        ],

        answer: 2
    },


    {
        question:
            "ما الأداة المناسبة لتلخيص وتحليل كمية كبيرة من البيانات؟",

        options: [
            "PivotTable",
            "WordArt",
            "Format Painter",
            "Page Layout"
        ],

        answer: 0
    },


    {
        question:
            "ما الأداة التي تستخدم لإزالة البيانات المكررة؟",

        options: [
            "Sort",
            "Filter",
            "Remove Duplicates",
            "Freeze Panes"
        ],

        answer: 2
    },


    {
        question:
            "ما وظيفة Filter في Excel؟",

        options: [
            "حذف البيانات",
            "عرض البيانات التي تحقق شروطًا معينة",
            "تغيير لون الخلايا",
            "دمج الخلايا"
        ],

        answer: 1
    },


    {
        question:
            "أي أداة تستخدم لإنشاء رسوم بيانية للبيانات؟",

        options: [
            "Charts",
            "Filter",
            "Sort",
            "Freeze Panes"
        ],

        answer: 0
    }

];


/****************************************************
 * Variables
 ****************************************************/

let currentQuestion = 0;

let score = 0;

let userName = "";

let startTime = null;

let timerInterval = null;

let timeLeft = 30;


/****************************************************
 * Start Test
 ****************************************************/

function startTest() {


    const nameInput =
        document.getElementById("name");


    userName =
        nameInput.value.trim();


    if (!userName) {

        alert(
            "من فضلك اكتب اسمك بالكامل أولًا"
        );

        nameInput.focus();

        return;

    }


    currentQuestion = 0;

    score = 0;

    startTime = new Date();


    document
        .getElementById("start")
        .style.display = "none";


    document
        .getElementById("test")
        .style.display = "block";


    showQuestion();

}


/****************************************************
 * Show Question
 ****************************************************/

function showQuestion() {


    clearInterval(timerInterval);


    timeLeft = 30;

    updateTimer();


    const question =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        `السؤال ${currentQuestion + 1} من ${questions.length}`;


    document
        .getElementById("question")
        .textContent =
        question.question;


    const optionsContainer =
        document.getElementById("options");


    optionsContainer.innerHTML = "";


    question.options.forEach(
        function(option, index) {


            const button =
                document.createElement("button");


            button.type = "button";


            button.className = "option";


            button.textContent = option;


            button.onclick =
                function() {

                    selectAnswer(index);

                };


            optionsContainer.appendChild(
                button
            );


        }
    );


    timerInterval =
        setInterval(
            function() {


                timeLeft--;

                updateTimer();


                if (timeLeft <= 0) {

                    clearInterval(
                        timerInterval
                    );

                    nextQuestion();

                }


            },
            1000
        );

}


/****************************************************
 * Timer
 ****************************************************/

function updateTimer() {


    document
        .getElementById("timer")
        .textContent =
        timeLeft;

}


/****************************************************
 * Select Answer
 ****************************************************/

function selectAnswer(index) {


    clearInterval(timerInterval);


    const question =
        questions[currentQuestion];


    if (
        index === question.answer
    ) {

        score++;

    }


    nextQuestion();

}


/****************************************************
 * Next Question
 ****************************************************/

function nextQuestion() {


    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        finishTest();

        return;

    }


    showQuestion();

}


/****************************************************
 * Finish Test
 ****************************************************/

function finishTest() {


    clearInterval(timerInterval);


    const endTime =
        new Date();


    const durationSeconds =
        Math.floor(
            (endTime - startTime) / 1000
        );


    const minutes =
        Math.floor(
            durationSeconds / 60
        );


    const seconds =
        durationSeconds % 60;


    const duration =
        `${minutes} دقيقة و ${seconds} ثانية`;


    const total =
        questions.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    let level;


    if (percentage >= 90) {

        level = "ممتاز";

    }
    else if (percentage >= 75) {

        level = "جيد جدًا";

    }
    else if (percentage >= 60) {

        level = "جيد";

    }
    else if (percentage >= 50) {

        level = "مقبول";

    }
    else {

        level = "يحتاج إلى تحسين";

    }


    document
        .getElementById("test")
        .style.display = "none";


    document
        .getElementById("result")
        .style.display = "block";


    document
        .getElementById("score")
        .textContent =
        `درجتك: ${score} من ${total}`;


    document
        .getElementById("percentage")
        .textContent =
        `النسبة: ${percentage}%`;


    document
        .getElementById("level")
        .textContent =
        `التقييم: ${level}`;


    saveResultToGoogleSheet({

        name: userName,

        score: score,

        total: total,

        percentage: percentage,

        duration: duration

    });

}


/****************************************************
 * Save Result To Google Sheets
 ****************************************************/

function saveResultToGoogleSheet(data) {


    const saving =
        document.getElementById("saving");


    saving.textContent =
        "جاري حفظ النتيجة...";


    /*
     * Hidden iframe
     */

    const iframe =
        document.createElement("iframe");


    iframe.name =
        "googleSheetFrame";


    iframe.style.display =
        "none";


    document.body.appendChild(
        iframe
    );


    /*
     * Form
     */

    const form =
        document.createElement("form");


    form.method = "POST";


    form.action =
        GOOGLE_SCRIPT_URL;


    form.target =
        "googleSheetFrame";


    form.style.display =
        "none";


    /*
     * Fields
     */

    addFormField(
        form,
        "name",
        data.name
    );


    addFormField(
        form,
        "score",
        data.score
    );


    addFormField(
        form,
        "total",
        data.total
    );


    addFormField(
        form,
        "percentage",
        data.percentage
    );


    addFormField(
        form,
        "duration",
        data.duration
    );


    /*
     * Submit
     */

    document.body.appendChild(
        form
    );


    form.submit();


    /*
     * Show success message
     */

    setTimeout(
        function() {

            saving.textContent =
                "✓ تم حفظ النتيجة بنجاح";

            saving.className =
                "saving success";


            form.remove();

            iframe.remove();

        },
        2000
    );

}


/****************************************************
 * Add Form Field
 ****************************************************/

function addFormField(
    form,
    name,
    value
) {


    const input =
        document.createElement(
            "input"
        );


    input.type = "hidden";


    input.name = name;


    input.value = value;


    form.appendChild(input);

}


</script>


</body>

</html>
